<html lang="ko">

<style>

.empty { color:var(--mute); text-align:center; padding:26px 10px; font-size:14px; }
.note { font-size:12px; color:var(--mute); margin:0; }
.badge { display:inline-flex; align-items:center; height:24px; padding:0 10px; border-radius:12px; font-size:12px; font-weight:500; }

.list { display:flex; flex-direction:column; gap:12px; }
table { border-collapse:collapse; width:100%; }

td { font-size:14px; padding:14px 16px; border-bottom:1px solid #F1EEF6; vertical-align:top; word-break:break-word; }
tr:last-child td { border-bottom:0; }
.tablebox { padding:20px 12px 8px; overflow-x:auto; }
.login { max-width:360px; margin:12vh auto 0; padding:36px 32px; display:flex; flex-direction:column; gap:12px; text-align:center; }
.login img { width:110px; margin:0 auto 4px; }

.h { font-size:13px; font-weight:500; color:var(--nav); margin-bottom:4px; }

.facts { display:flex; gap:10px 28px; flex-wrap:wrap; font-size:13px; color:var(--soft); }
.side .big { font-size:15px; font-weight:500; }
.opt { display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:12px; border:1px solid var(--line); font-size:14px; cursor:pointer; }
.opt .radio { width:16px; height:16px; border-radius:50%; border:1.5px solid var(--bar); flex:none; }
.opt.on { border:1.5px solid var(--violet); background:#F7F5FB; }

.side textarea { height:84px; border-radius:12px; border:1px solid var(--line); padding:12px 14px; font-size:13px; resize:none; outline:none; color:var(--ink); }

.clickrow { cursor:pointer; } .clickrow:hover .k { color:var(--violet); }
.crumb { display:flex; align-items:baseline; gap:12px; } .crumb h1 { margin:0; font-size:22px; font-weight:500; } .crumb .slash { color:var(--bar); }

.av.big { width:36px; height:36px; margin:0; }

.kpis { padding:22px 0; display:grid; grid-template-columns:repeat(5, 1fr); }

.kpi.last { border-right:0; } .kpi .sub { font-size:13px; } .kpi small { color:#B3AEC4; font-size:13px; } .kpi b { font-size:22px; font-weight:600; }
a.btn { text-decoration:none; }
.kgrid { display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; }
.kcard { padding:18px 20px; display:flex; flex-direction:column; gap:6px; min-width:0; }
.kcard .sub { font-size:13px; } .kcard b { font-size:30px; font-weight:600; line-height:1.1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .kcard small { font-size:12px; min-height:14px; }
.mono { font-family:ui-monospace, Menlo, monospace; font-size:12.5px; }
tr.hot td { background:#F7F5FB; }
.trace { margin:0; padding:16px; border-radius:12px; background:#2A2640; color:#D9D3EA; font-size:12px; line-height:1.7; white-space:pre-wrap; word-break:break-word; font-family:ui-monospace, Menlo, monospace; }
.detail.err { grid-template-columns:1fr 340px; }
.seg.wide { align-self:stretch; display:flex; } .seg.wide button { flex:1; }
@media (max-width:860px) {
  .kgrid { grid-template-columns:1fr 1fr; } .detail.err { grid-template-columns:1fr; }
  .kpis { grid-template-columns:1fr 1fr; row-gap:18px; } .kpi { border-right:0; padding:0 20px; }
  .tablebox th, .tablebox td { white-space:nowrap; } .ell { max-width:200px; }
  .search { width:100%; } .head .r { flex-wrap:wrap; }
  .detail { grid-template-columns:1fr; }
  .wrap { flex-direction:column; }
  aside { width:auto; flex-direction:row; flex-wrap:wrap; align-items:center; padding:14px 16px; gap:6px; border-right:0; border-bottom:1px solid var(--line); }
  .brand { padding:0 8px 0 0; } .brand img { width:64px; }
  aside .nav { width:auto; height:36px; padding:0 12px; }
  aside .grow { display:none; }
  .me { flex-direction:row; align-items:center; padding:8px 12px; margin-left:auto; }
  main { padding:20px 16px 32px; }
  .stats { grid-template-columns:1fr; padding:20px 20px 4px; row-gap:20px; }
  .two { grid-template-columns:1fr; }
  .box { padding:18px 20px; }
}
</style>

<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// 서버 비밀키는 없다: 공개 키 + 로그인한 관리자 계정. 보이는 것과 처리는 모두 서버가 관리자인지 확인한 뒤에만 된다.
const sb = supabase.createClient('https://gwkzhdafsgimmrwwfkop.supabase.co', 'sb_publishable_w8ZHKCAmFYeeVDt8-yrt1Q_smuB2X8e');
const STORAGE = { bytes: 1073741824, label: 'Supabase 무료 1 GB' };   // Pro로 바꾸면 { bytes: 100 GB, label: 'Supabase Pro 100 GB' }
const KIND = { memorial:'비석', guestbook:'방명록', reply:'방명록 답글', user:'광장의 사람', post:'게시판 글', comment:'게시판 댓글' };
const STATUS = { open:['처리 전','b-wait'], hidden:['숨김','b-done'], dismissed:['문제없음','b-skip'] };
const TYPE = { memorial:'비석', guestbook:'방명록', reply:'방명록 답글', user:'사용자', post:'게시글', comment:'댓글' };
const ICON = {
  stats:'<path d="M4 13h6V4H4zM14 20h6V11h-6zM14 4v4h6V4zM4 16v4h6v-4z"/>',
  reports:'<path d="M5 21V4h11l-1.5 4L16 12H5"/>',
  errors:'<path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18.6A2 2 0 0 0 3.5 21.6h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
};
const $app = document.getElementById('app');
let tab = 'stats', who = '', counts = { open_reports: 0, errors_24h: 0 }, repFilter = 'open', openReport = null, memFilter = 'all', memQ = '', openMember = null, subsEnv = 'Production', errDays = 1, openError = null;

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith('on')) e[k] = v; else if (k === 'class') e.className = v; else if (k === 'html') e.innerHTML = v;
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}
const svg = (p, s = 18, w = 1.6) => el('span', { html: `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`, style: 'display:flex' });
const KST = { timeZone: 'Asia/Seoul' };
const stamp = t => new Date(t).toLocaleString('ko-KR', { ...KST, month:'numeric', day:'numeric', hour:'numeric', minute:'2-digit' });
const dayKey = t => new Date(t).toLocaleDateString('en-CA', KST);
function ago(t) {   // 오늘이면 시각, 어제면 '어제', 그 전은 날짜
  const d = dayKey(t), today = dayKey(Date.now()), yest = dayKey(Date.now() - 864e5);
  if (d === today) return new Date(t).toLocaleTimeString('ko-KR', { ...KST, hour:'numeric', minute:'2-digit' });
  if (d === yest) return '어제';
  return new Date(t).toLocaleDateString('ko-KR', { ...KST, month:'numeric', day:'numeric' });
}
function size(b) {
  if (b >= 1073741824) return [(b / 1073741824).toFixed(2), 'GB'];
  if (b >= 1048576) return [(b / 1048576).toFixed(1), 'MB'];
  return [(b / 1024).toFixed(0), 'KB'];
}

function login(msg) {
  const mail = el('input', { type:'email', value:'onyu.help@gmail.com', autocomplete:'username' });
  const pw = el('input', { type:'password', placeholder:'비밀번호', autocomplete:'current-password' });
  const go = el('button', { class:'btn main', type:'submit' }, '로그인');
  const note = el('p', {}, msg || '관리자 계정으로 로그인해 주세요.');
  const form = el('form', { class:'panel login' }, el('img', { src:'logo.png', alt:'ONYU' }), note, mail, pw, go);
  form.onsubmit = async e => {
    e.preventDefault(); go.disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: mail.value.trim(), password: pw.value });
    go.disabled = false;
    if (error) { pw.value = ''; note.textContent = error.message.includes('confirm') ? '메일 인증이 아직 안 됐어요.' : '메일이나 비밀번호가 맞지 않아요.'; return; }
    start();
  };
  $app.replaceChildren(form);
}

async function start() {
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return login();
  who = session.user.email || '';
  const { data:ok, error } = await sb.rpc('is_admin');
  if (error || !ok) { await sb.auth.signOut(); return login('이 계정은 관리자가 아니에요. onyu.help@gmail.com 으로 로그인해 주세요.'); }
  ready = true; fromHash(); render(true);
}

function shell(title, body, extra) {
  const nav = (k, name, n) => el('button', { class:'nav' + (tab === k || (k === 'stats' && (tab === 'members' || tab === 'subs')) ? ' on' : ''), onclick: () => { tab = k; openReport = null; openMember = null; openError = null; render(); } },
    svg(ICON[k]), name, n ? el('span', { class:'count' }, n) : null);
  const aside = el('aside', {},
    el('div', { class:'brand' }, el('img', { src:'logo.png', alt:'ONYU' }), el('span', {}, '관리자')),
    nav('stats', '현황'), nav('reports', '신고', counts.open_reports), nav('errors', '앱 오류', counts.errors_24h),
    el('a', { class:'nav', href:'https://mail.google.com/mail/u/?authuser=onyu.help@gmail.com', target:'_blank', rel:'noopener' },
      svg('<path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/>'), '문의 메일함', el('span', { class:'ext' }, '↗')),
    el('div', { class:'grow', style:'flex:1' }),
    el('div', { class:'me' }, el('span', {}, who), el('button', { onclick: async () => { await sb.auth.signOut(); ready = false; history.replaceState(null, '', location.pathname); login(); } }, '로그아웃')));
  const refresh = el('button', { class:'btn', onclick: () => render(true) }, svg('<path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/>', 14, 1.8), '새로고침');
  const head = el('div', { class:'head' }, typeof title === 'string' ? el('h1', {}, title) : title, el('div', { class:'r' }, extra || null, refresh));
  $app.replaceChildren(el('div', { class:'wrap' }, aside, el('main', {}, head, body)));
}

// 화면마다 주소(#...)를 붙여서 뒤로 가기·새로고침·링크가 그 화면을 기억한다
let ready = false;
function toHash() {
  if (tab === 'members') return openMember ? '#member/' + openMember : '#members/' + memFilter;
  if (tab === 'subs') return '#subs/' + (subsEnv === 'Sandbox' ? 'sandbox' : 'live');
  if (tab === 'reports') return openReport ? '#report/' + openReport : '#reports/' + repFilter;
  if (tab === 'errors') return openError ? '#error/' + encodeURIComponent(openError.kind) + '/' + encodeURIComponent(openError.message) : '#errors/' + errDays;
  return '';
}
function fromHash() {
  const [k, a, b] = location.hash.replace(/^#/, '').split('/');
  tab = 'stats'; openMember = null; openReport = null; openError = null;
  if (k === 'members') { tab = 'members'; memFilter = ['all', 'today', 'plus', 'guest'].includes(a) ? a : 'all'; }
  else if (k === 'member' && a) { tab = 'members'; openMember = a; }
  else if (k === 'subs') { tab = 'subs'; subsEnv = a === 'sandbox' ? 'Sandbox' : 'Production'; }
  else if (k === 'reports') { tab = 'reports'; repFilter = ['open', 'done', 'all'].includes(a) ? a : 'open'; }
  else if (k === 'report' && /^\d+$/.test(a || '')) { tab = 'reports'; openReport = Number(a); }
  else if (k === 'errors') { tab = 'errors'; errDays = [1, 7, 90].includes(Number(a)) ? Number(a) : 1; }
  else if (k === 'error' && a != null) { tab = 'errors'; openError = { kind: decodeURIComponent(a), message: decodeURIComponent(b || '') }; }
}

async function render(fromHistory) {
  const h = toHash();
  if (!fromHistory && (location.hash || '') !== h) history.pushState(null, '', h || location.pathname + location.search);
  const title = tab === 'stats' ? '현황' : tab === 'errors' ? (openError ? '오류 상세' : '앱 오류') : tab === 'members' ? '회원' : tab === 'subs' ? '구독' : openReport ? '신고 처리' : '신고';
  shell(title, el('p', { class:'note' }, '불러오는 중…'));
  try {
    const [body, extra, head] = await (tab === 'stats' ? stats() : tab === 'errors' ? (openError ? errorDetail(openError) : errors()) : tab === 'subs' ? subs() : tab === 'members' ? (openMember ? memberDetail(openMember) : members())
      : openReport ? reportDetail(openReport) : reports());
    shell(head || title, body, extra);
    if (tab === 'members' && !openMember && memFocus) { const i = document.querySelector('.search input'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
  } catch (e) {
    shell(title, el('div', { class:'panel empty' }, '불러오지 못했어요: ' + (e.message || e)));
  }
}

    kv('사진·영상 용량', `${sn} ${su}`), kv('받은 신고', d.reported));
  return [el('div', { style:'display:flex;flex-direction:column;gap:12px' }, el('div', { class:'two' }, account, right),
    el('p', { class:'note' }, '읽기만 하는 화면이에요. 일기는 가족과 함께 쓰는 아이의 일기 전체 개수예요.')), null, crumb('회원', back, d.name || (d.provider === 'guest' ? '손님' : '(닉네임 없음)'))];
}

const PRICE = { monthly: 4900, yearly: 48900 };   // 한국 App Store 가격 (원)
const won = n => Math.round(n).toLocaleString('ko-KR') + '원';
const ymd = t => new Date(t).toLocaleDateString('ko-KR', KST);

async function subs() {
  const { data, error } = await sb.rpc('admin_subs', { p_env: subsEnv });
  if (error) throw error;
  const now = Date.now(), month = dayKey(now).slice(0, 7);
  const live = r => ['active', 'grace'].includes(r.status) && (!r.expires_at || new Date(r.expires_at) > now);
  const yearly = r => /yearly/.test(r.product);
  const on = data.filter(live), m = on.filter(r => !yearly(r)).length, y = on.filter(yearly).length;
  const mrr = m * PRICE.monthly + y * PRICE.yearly / 12;
  const churn = data.filter(r => (!r.auto_renew || !live(r)) && dayKey(r.updated_at).slice(0, 7) === month).length;
  const stat = (k, sub, v, last) => el('div', { class:'kpi' + (last ? ' last' : '') }, el('span', { class:'sub' }, k, sub ? el('small', {}, ' ' + sub) : null), el('b', {}, v));
  const kpis = el('div', { class:'panel kpis' }, stat('이용 중', null, on.length), stat('월간', null, m), stat('연간', null, y),
    stat('월 환산 매출', '수수료 전', won(mrr)), stat('이번 달 해지', null, churn, true));
  const state = r => !live(r) ? ({ revoked:['취소됨','b-skip'], refunded:['환불','b-skip'] }[r.status] || ['만료','b-skip'])
    : r.status === 'grace' ? ['결제 문제','b-wait'] : r.auto_renew ? ['이용 중','b-done'] : ['해지 예정','b-wait'];
  const next = r => !r.expires_at ? '—' : ymd(r.expires_at) + (!live(r) ? ' 종료됨' : r.auto_renew ? ' 다음 결제' : ' 종료');
  const rows = data.map(r => {
    const [sl, sc] = state(r);
    return el('tr', {},
      el('td', {}, r.name || el('span', { class:'sub' }, r.user_id ? '(닉네임 없음)' : '(탈퇴한 회원)')),
      el('td', {}, yearly(r) ? `연간 ${won(PRICE.yearly)}` : `월간 ${won(PRICE.monthly)}`),
      el('td', {}, el('span', { class:'badge ' + sc }, sl)),
      el('td', { class:'sub' }, next(r)),
      el('td', { class:'sub' }, ymd(r.updated_at)),
      el('td', { class:'sub' }, 'App Store'),
      el('td', {}, el('span', { class:'badge b-plum' }, r.env === 'Sandbox' ? '샌드박스' : '실제 결제')),
      el('td', { style:'text-align:right' }, r.user_id ? el('button', { class:'linkbtn', onclick: () => { tab = 'members'; openMember = r.user_id; render(); } }, '회원') : null));
  });
  const table = rows.length ? el('div', { class:'panel tablebox' }, el('table', {},
      el('thead', {}, el('tr', {}, ['회원', '플랜', '상태', '다음 결제 · 종료', '마지막 변경', '결제', '환경', ''].map(h => el('th', {}, h)))), el('tbody', {}, rows)))
    : el('div', { class:'panel empty' }, subsEnv === 'Sandbox' ? '테스트 결제 기록이 없어요.' : '아직 실제 결제한 구독이 없어요.');
  const seg = el('div', { class:'seg' }, [['Production', '실제 결제'], ['Sandbox', '샌드박스']].map(([k, n]) =>
    el('button', { class: subsEnv === k ? 'on' : '', onclick: () => { subsEnv = k; render(); } }, n)));
  const asc = el('a', { class:'btn', href:'https://appstoreconnect.apple.com/apps/6834186422/distribution/subscriptions', target:'_blank', rel:'noopener' }, 'App Store Connect ↗');
  const head = crumb('현황', () => { tab = 'stats'; render(); }, '구독');
  return [el('div', { style:'display:flex;flex-direction:column;gap:14px' }, kpis, table,
    el('p', { class:'note' }, '결제·환불·영수증은 Apple이 처리해요. 여기서는 상태만 확인하고, 변경은 App Store Connect에서 해요. 금액은 한국 가격으로 셈하고(미국 결제도 같은 값으로), 연간은 12로 나눠 월 환산해요. 이번 달 해지는 이번 달에 자동 갱신을 끄거나 끝난 구독이에요.')),
    el('div', { class:'r' }, seg, asc), head];
}

const SCREEN = { upload:'사진·영상 올리기', video:'영상 담기', kakao:'카카오톡 공유', purchase:'결제 확인' };
const ERR = { open:['미해결','b-wait'], again:['다시 발생','b-wait'], seen:['확인함','b-plum'], fixed:['해결됨','b-done'] };
const CRASH = '앱이 튕긴 것(크래시)은 여기 오지 않아요: Xcode → Window → Organizer → Crashes 에서 봐요.';

async function errors() {
  const calls = [sb.rpc('admin_error_list', { p_days: errDays })];
  if (errDays !== 1) calls.push(sb.rpc('admin_error_list', { p_days: 1 }));
  if (errDays !== 7) calls.push(sb.rpc('admin_error_list', { p_days: 7 }));
  const res = await Promise.all(calls);
  for (const r of res) if (r.error) throw r.error;
  const list = res[0].data, pick = d => d === errDays ? list : res[1 + (errDays !== 1 && d === 7 ? 1 : 0)].data;
  const sum = rows => rows.reduce((a, r) => a + Number(r.count), 0);
  const d1 = sum(pick(1)), d7 = sum(pick(7));
  counts.errors_24h = d1;
  const byKind = {}; list.forEach(r => byKind[r.kind] = (byKind[r.kind] || 0) + Number(r.count));
  const top = Object.entries(byKind).sort((a, b) => b[1] - a[1])[0];
  const card = (k, v, sub) => el('div', { class:'panel kcard' }, el('span', { class:'sub' }, k), el('b', {}, v), el('small', { class:'sub' }, sub || ' '));
  const kpis = el('div', { class:'kgrid' }, card('24시간 발생', d1), card('7일 발생', d7),
    card('영향받은 사용자', list.length ? list[0].users_all : 0, errDays === 1 ? '24시간' : errDays === 7 ? '7일' : '90일'),
    card('가장 많은 화면', top ? (SCREEN[top[0]] || top[0]) : '—', top ? `${top[1]}회` : null));
  const go = r => { openError = { kind: r.kind, message: r.message }; render(); };
  const rows = list.map(r => {
    const [sl, sc] = ERR[r.status] || ERR.open;
    return el('tr', { class:'click' + (['open', 'again'].includes(r.status) ? ' hot' : ''), onclick: () => go(r) },
      el('td', { class:'sub', style:'white-space:nowrap' }, hm(r.last_at)),
      el('td', { class:'sub', style:'white-space:nowrap' }, [r.os, r.app_ver].filter(Boolean).join(' · ') || '—'),
      el('td', {}, el('span', { class:'badge b-plum' }, SCREEN[r.kind] || r.kind)),
      el('td', { class:'ell mono' }, r.message || '(메시지 없음)'),
      el('td', { style:'text-align:center' }, r.count),
      el('td', { class:'sub' }, r.last_user + (r.users > 1 ? ` 외 ${r.users - 1}명` : '')),
      el('td', {}, el('span', { class:'badge ' + sc }, sl)),
      el('td', { style:'text-align:right' }, el('button', { class:'linkbtn', onclick: e => { e.stopPropagation(); go(r); } }, '보기')));
  });
  const table = rows.length ? el('div', { class:'panel tablebox' }, el('table', {},
      el('thead', {}, el('tr', {}, ['마지막 발생', '환경', '화면', '메시지', '횟수', '사용자', '상태', ''].map((h, i) => el('th', i === 4 ? { style:'text-align:center' } : {}, h)))), el('tbody', {}, rows)))
    : el('div', { class:'panel empty' }, { 1:'최근 24시간 동안 앱 오류가 없어요.', 7:'최근 7일 동안 앱 오류가 없어요.', 90:'최근 90일 동안 앱 오류가 없어요.' }[errDays]);
  const seg = el('div', { class:'seg' }, [[1, '24시간'], [7, '7일'], [90, '전체']].map(([k, n]) =>
    el('button', { class: errDays === k ? 'on' : '', onclick: () => { errDays = k; render(); } }, n)));
  return [el('div', { style:'display:flex;flex-direction:column;gap:14px' }, kpis, table,
    el('p', { class:'note' }, '같은 화면·같은 메시지는 한 줄로 묶어요. 전체는 최근 90일이에요. ' + CRASH)),
    el('div', { class:'r' }, seg, el('span', { class:'stamp' }, '기준 ' + stamp(Date.now())))];
}

async function errorDetail(key) {
  const { data:d, error } = await sb.rpc('admin_error_detail', { p_kind: key.kind, p_message: key.message });
  if (error) throw error;
  const back = el('button', { class:'linkbtn soft', onclick: () => { openError = null; render(); } }, '← 목록');
  const [sl, sc] = ERR[d.status] || ERR.open;
  const ev = d.events || [], last = ev[0] || {};
  const pre = [d.message || '(메시지 없음)', '',
    `화면: ${SCREEN[d.kind] || d.kind} (${d.kind})`,
    d.first_at ? `처음 발생: ${stamp(d.first_at)} · 마지막 발생: ${stamp(d.last_at)}` : '발생 기록 없음',
    last.os || last.app ? `최근 환경: ${[last.os, last.app ? 'ONYU ' + last.app : null].filter(Boolean).join(' · ')}` : null,
    d.versions && d.versions.length ? `앱 버전: ${d.versions.join(', ')}` : null].filter(x => x !== null).join('\n');
  const main = el('div', { class:'panel pad', style:'gap:12px' },
    el('div', { class:'top' }, el('span', { class:'badge b-plum' }, SCREEN[d.kind] || d.kind), el('span', { class:'badge ' + sc }, sl),
      el('span', { class:'sub', style:'margin-left:auto;font-size:12px' }, `${d.count}회 · 사용자 ${d.users}명`)),
    el('span', { class:'mono', style:'font-size:15px;font-weight:500;word-break:break-word' }, d.message || '(메시지 없음)'),
    el('pre', { class:'trace' }, pre));
  const hist = el('div', { class:'panel pad', style:'gap:4px' }, el('span', { class:'h' }, '발생 기록' + (ev.length >= 50 ? ' (최근 50번)' : '')),
    ev.length ? ev.map(e => el('div', { class:'hrow' },
      el('span', {}, e.uid ? el('button', { class:'linkbtn', style:'font-weight:400;color:inherit', onclick: () => { tab = 'members'; openMember = e.uid; openError = null; render(); } }, e.who) : e.who,
        ' · ' + ([e.os, e.app].filter(Boolean).join(' · ') || '환경 정보 없음')), el('span', { class:'sub' }, hm(e.at))))
      : el('p', { class:'note' }, '기록이 없어요.'));
  let pickS = d.status === 'again' ? 'open' : d.status;
  const seg = el('div', { class:'seg wide' }, [['open', '미해결'], ['seen', '확인함'], ['fixed', '해결됨']].map(([k, n]) => {
    const b = el('button', { class: pickS === k ? 'on' : '', onclick: () => { pickS = k; seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); } }, n);
    return b;
  }));
  const memo = el('textarea', { placeholder:'메모 — 원인, 수정 버전 등', maxlength:'500' }); memo.value = d.note || '';
  const save = async (all, btn) => {
    btn.disabled = true;
    const { error } = await sb.rpc('admin_error_mark', { p_kind: d.kind, p_message: d.message, p_status: all ? 'fixed' : pickS, p_note: memo.value, p_all_kind: !!all });
    if (error) { alert('저장하지 못했어요: ' + error.message); btn.disabled = false; return; }
    render();
  };
  const saveBtn = el('button', { class:'btn main big', onclick: e => save(false, e.currentTarget) }, '저장');
  const allBtn = el('button', { class:'linkbtn soft', style:'align-self:center', onclick: e => { if (confirm(`'${SCREEN[d.kind] || d.kind}' 종류의 오류를 모두 해결됨으로 표시할까요?`)) save(true, e.currentTarget); } },
    '같은 종류 오류 모두 해결됨으로 표시');
  const side = el('div', { class:'panel pad side', style:'gap:14px' }, el('span', { class:'big' }, '상태'), seg, memo, saveBtn, allBtn,
    d.triaged_at ? el('p', { class:'note' }, '마지막 저장 ' + stamp(d.triaged_at) + (d.status === 'again' ? ' · 해결됨으로 적은 뒤 다시 생겼어요' : '')) : null);
  return [el('div', { class:'detail err' }, el('div', { class:'col' }, main, hist), side), back];
}

start();
</script>
